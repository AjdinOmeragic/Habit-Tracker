<!-- COMMUNITY -->
<section id="community">
  <div class="community-section">
    <div class="hero-section">
      <div class="hero-content">
        <h1>Community</h1>
        <p>Share your journey and get inspiration from others</p>
      </div>
    </div>

    <div class="container">
      <!-- Create Post Form -->
      <div class="create-post card">
        <h2>Create a Post</h2>
        <form id="create-post-form" class="post-form">
          <div class="form-group">
            <input
              type="text"
              name="title"
              placeholder="Post Title"
              class="form-input"
              required
            />
          </div>
          <div class="form-group">
            <textarea
              name="content"
              placeholder="Share your thoughts, progress, knowledge, etc..."
              class="form-input"
              rows="4"
              required
            ></textarea>
          </div>
          <div class="post-actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-paper-plane"></i> Post to Community
            </button>
          </div>
        </form>
        <p
          style="
            color: var(--text-secondary);
            margin-top: 1rem;
            font-size: 0.9rem;
          "
        >
          <i class="fas fa-lightbulb"></i> Be supportive and respectful!
        </p>
      </div>

      <!-- Community Posts -->
      <div class="posts-list">
        <div class="post-header" style="margin-bottom: 1.5rem">
          <h2>Community Posts</h2>
          <div class="habit-actions">
            <button class="btn btn-secondary" onclick="PostService.loadPosts()">
              <i class="fas fa-sync-alt"></i> Refresh
            </button>
          </div>
        </div>

        <div id="posts-container" class="posts-container">
          <div class="card" style="text-align: center; padding: 3rem">
            <div
              class="spinner-border text-primary"
              role="status"
              style="width: 3rem; height: 3rem"
            >
              <span class="visually-hidden">Loading...</span>
            </div>
            <p style="margin-top: 1rem; color: var(--text-secondary)">
              Loading community posts...
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
