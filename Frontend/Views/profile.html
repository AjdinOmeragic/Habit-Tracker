<!-- PROFILE -->
<section id="profile">
  <div class="profile-section">
    <div class="hero-section">
      <div class="hero-content">
        <h1>My Profile</h1>
        <p id="profile-welcome">Manage your account and track your activity</p>
      </div>
    </div>

    <div class="container">
      <div class="profile-container">
        <!-- Profile Information -->
        <div class="profile-card card">
          <h2>Profile Information</h2>
          <div class="profile-info">
            <div class="form-group">
              <label for="profile-username">Username</label>
              <input
                type="text"
                id="profile-username"
                class="form-input"
                readonly
              />
            </div>
            <div class="form-group">
              <label for="profile-email">Email</label>
              <input
                type="email"
                id="profile-email"
                class="form-input"
                readonly
              />
            </div>
            <div class="form-group">
              <label for="profile-role">Account Type</label>
              <input
                type="text"
                id="profile-role"
                class="form-input"
                value="Standard User"
                readonly
              />
            </div>
          </div>
        </div>

        <!-- Statistics -->
        <div class="stats-card card">
          <h2>My Statistics</h2>
          <div class="values-grid">
            <div class="value-item">
              <h4>Active Habits</h4>
              <div class="stat-value" id="habits-count">0</div>
            </div>
            <div class="value-item">
              <h4>Community Posts</h4>
              <div class="stat-value" id="posts-count">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
